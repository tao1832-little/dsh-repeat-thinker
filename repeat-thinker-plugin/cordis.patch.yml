# Cordis Patch for Repeat Thinker Plugin
# 重复思考检测插件配置

- insert:
    - id: repeat-thinker
      name: '@deepseek-ai/dsh-repeat-thinker'
      configSchema:
        type: object
        properties:
          enabled:
            type: boolean
            default: true
            description: "是否启用重复思考检测"
          threshold:
            type: integer
            minimum: 1
            maximum: 10
            default: 3
            description: "触发打断的重复次数阈值（相同思考模式）"
          windowSize:
            type: integer
            minimum: 5
            maximum: 50
            default: 20
            description: "检测窗口大小（最近 N 次思考）"
          similarityThreshold:
            type: number
            minimum: 0.7
            maximum: 1.0
            default: 0.85
            description: "相似度阈值（低于此值视为重复）"
          maxInterruptionsPerSession:
            type: integer
            minimum: 1
            maximum: 100
            default: 5
            description: "每会话最大打断次数"
          interruptMessage:
            type: string
            default: "检测到重复思考模式，已自动打断循环。请尝试重新表述问题或提供新信息。"
            description: "打断时显示的提示消息"
        required: []
